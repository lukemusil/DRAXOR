    <script>
      (function () {
        var category = {
          "a-frame": "/a-frame-chata",
          "a-frame-chaty": "/a-frame-chata",
          chaty: "/a-frame-chata",
          sruby: "/srub",
          srub: "/srub",
          drevostavby: "/drevostavby",
          pergoly: "/bioklimaticke-pergoly",
          altany: "/altany",
          terasy: "/terasy",
          "akusticke-panely": "/akusticke-panely",
        };
        var ids = {};
        var path = location.pathname.replace(/\/+$/, "") || "/";
        var query = new URLSearchParams(location.search);
        var target = null;
        if (query.get("page_id")) target = ids["page_id:" + query.get("page_id")] || "/";
        else if (query.get("p")) target = ids["p:" + query.get("p")] || "/";
        else if (path.indexOf("/category/") === 0) {
          var slug = decodeURIComponent(path.split("/")[2] || "");
          target = category[slug] || "/";
        }
        if (target && target !== path) location.replace(target);
      })();
    </script>
